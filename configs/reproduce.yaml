# 最终提交复现配置（唯一事实来源 / single source of truth）
#
# 由 scripts/repro_cfg.py 读取，供 14~18 号 .bat 使用：
#   14_submit_1_env_check.bat      环境自检
#   15_submit_2_sdfnet_infer.bat   SDF-Net 成员的测试集推理
#   16_submit_3_shipvit_infer.bat  ship_reid_vit 测试集推理（纯特征推理）
#   17_submit_4_rrf_fuse.bat       RRF 倒数排名融合 -> prediction.json
#   18_submit_5_verify.bat         提交格式终检
#
# 所有相对路径一律相对本工程根目录（Multi-source-...-main）解析（scripts/repro_cfg.py::resolve）。
#
# ---------------------------------------------------------------------------
# 怎么改集成方案（两处，互不干扰）
#
#   加成员：在 ensemble.members 里加一条 {name, ckpt, pred}
#           ckpt 相对 sdf_checkpoint_dir（也可写绝对路径）；留空表示不需要本地推理
#           若要接入 ship_reid_vit 系（异构骨干）成员，另加 vit_config + vit_ckpt
#           （均相对 shipvit_dir），16 号脚本会按此自动推理出 pred；vit_config 必须逐成员
#           指定，因为 split_idx 不在 checkpoint 的配置回填白名单内
#   改权重：在 ensemble.presets 里对应的预设下改数字，或增删该预设里的成员条目
#           预设里没列出的成员不参与融合；权重必须 > 0
#   改方向权重：在预设里加可选键 per_direction: {O2S|S2O|O2O: {成员名: 权重（>= 0）}}
#           仅覆盖该方向列出的成员，其余方向/成员沿用上面的基础权重；0 = 该方向剔除该成员
#   切预设：改 ensemble.active 一行；或运行时用 17_submit_4_rrf_fuse.bat --preset <名>
#   临时扫权重：17_submit_4_rrf_fuse.bat --weights 2 1 1 1
#           （个数需与当前预设的成员数一致，按预设内顺序一一对应）
# ---------------------------------------------------------------------------

paths:
  # 官方赛题文件（本地实际位于工程内 赛题6-初赛/ 目录）
  test_task: ../question6-data/preliminary-round-test-data/task.json
  # SDF-Net 主骨干
  sdfnet_dir: SDF-Net
  sdfnet_config: configs/SDF-Net.yml                 # 相对 sdfnet_dir；推理必须在 SDF-Net 目录下运行
  sdfnet_official: SDF-Net/logs/SDF-Net/SDF-Net_256.pth
  sdf_checkpoint_dir: logs/SDF-Net-finetune
  sdf_sim_dir: sims/test
  # ship_reid_vit 异构分支
  shipvit_dir: ship_reid_vit
  shipvit_pred: sims/test/top100_shipvit.json   # 必须与 members 里 ship_reid_vit 的 pred 一致
  # 最终提交文件
  out_prediction: ../prediction.json

ensemble:
  # RRF 平滑常数 k 与「成员暴露给融合的排名深度」member_topk 存在强交互：
  # 成员只暴露 top-10 时（member_topk=10）k=10 不可能抬高召回上限；把成员放到 top-100
  # 并降低 k，才让「只在某人 top-100 内的候选」有机会进入输出 top-10。
  # 波次8（2026-10-12）k 重扫（12 成员，无泄漏 2828 local_val）：
  #   k=1 0.6905 / k=3 0.6955 / k=5 0.6973 / k=7 0.7008 / k=10 0.7025（峰值）/
  #   k=15 0.7009 / k=20 0.7022 / k=30 0.6995 / k=50 0.6964
  #   k=10 相对 k=3 +0.0070，fold0 0.7165（+0.0079）/fold1 0.6884（+0.0060）双折同向。
  #   对比方法（同期横评，均在同一 sims 口径）：Score-minmax 0.7004、Hybrid(pool=100) 0.7046；
  #   两者依赖相似度分数标定，对跨集合的分数分布口径敏感；RRF 仅用排名（协议无关），故采用 k=10。
  #   更正（波次11，2026-10-12）：原记「local_val sim 为 tta+rerank 而测试集成员为 base 纯特征，
  #   存在协议错配」不成立——经逐位复现核实，测试侧成员文件同为 tta+rerank 产物（267/267 全等，
  #   详见下文波次11 注释）；RRF 的协议无关理由不受影响。
  k: 10          # RRF 平滑常数，score = sum(w / (k + rank))
  topk: 10       # 每条 query 保留的候选数（赛题要求恰好 10）
  member_topk: 100   # 各成员输入融合的排名深度（写入成员 pred 文件的候选数）

  # 生效的预设（改这一行即可切换集成方案）
  # 波次9（2026-10-12）：由波次8 的 12 成员剪掉最弱成员 cnx_s -> 11 成员（local_val 2828 口径 +0.0066）
  #   波次8（12 成员，DINOv2-B 三重门槛已过）保留为回滚点 prediction_12m_k10_bak.json
  # 波次10（2026-10-12）：11 成员 + O2S 方向覆盖（mos75=1.5 / shipvit=0.5 / cnx_t=0.25）
  #   local_val 2828 口径 +0.0042，8k×3 折分割全通过；波次9（11 成员同权重）保留为回滚点
  #   prediction_11m_nocnxs_k10_bak.json
  # 波次12（2026-10-12，【官方判负，已回滚】）：曾把 dino 两成员换成全量重训版并切 active，
  #   官方分 0.758 → 0.741（−0.017）—— 与 exp_008 同型复现：盲链上叠盲成员（全量 dino 已见全部身份，
  #   无无泄漏验证；其筛选证据来自缩水基座，部署到全量基座失据）= 无效验证，官方判负。
  #   处置：active 退回 final_full_b75_cm_dino_nocnxs_dir（dino 用缩水版 ep040/060），
  #         prediction.json 回滚 prediction_11m_wave11_bak.json（sha 9C7A42B9…）。
  #   教训：全量基座上任何「已见全部身份」的新成员/新权重，官方分前一律视为未验证；
  #         本地三重门槛只对「同基座、同泄漏状态」成立（exp_008 / 波次12 双重证据）。
  # 波次13（2026-10-12，【S5 转导互反重排，已部署待官方分】）：prediction.json = S5 候选
  #   （sha 237F1E77…），基座仍是本 active 预设的 11 成员 RRF，**未改任何成员/权重/k/方向覆盖**。
  #   配方（S5 = 保真基座 + R2 互反项）：
  #     基座：11 个现役 pred 文件 RRF（k=10、member_topk=100、O2S 覆盖 mos75=1.5/shipvit=0.5/cnx_t=0.25），
  #           保真自检 267/267 逐字节复现波次11 部署物（sha 9C7A42B9…）。
  #     R2 互反项：10 个现役权重稠密 sim（tta+rerank，k1=20/k2=6/λ=0.3）在**目标模态内**归一化均值，
  #           score(c) = RRF_base(c) + 0.5 * R2(c)；base75 无稠密 sim（权重在队友 D: 盘），仅经基座贡献。
  #   稠密 sim 资产：sims/test_rerank_full/sim_*.pt（7 个 ship_reid 全量+缩水 dino）+
  #           sims/test_rerank/sdfsim_{mos75,ep45,ep25}_full/sim.pt（3 个 SDF-Net 全量），均 267×1800。
  #   关键坑（务必复用）：①gallery 模态判定必须用 task.json 的 **modality 字段**——
  #           image_path 全是 gallery/g_xxx.tif，无光学/SAR 前缀，按路径 startswith 会全判成 SAR；
  #         ②sims/test_rerank/ 原有 sim_*.pt 是 10-10 旧权重快照（ship_reid 系 top1 一致率 0~2/267），
  #           与现役 pred 不同源，**不可用作现役基座**，须用现役权重重新生成稠密 sim；
  #         ③现役 pred 文件 = inference.py --tta --rerank 的 out_prediction 输出（重跑 267/267 复现证实），
  #           但从 save_sim 稠密矩阵排序**无法**重现其 top-100（rerank 非线性），故基座只能用 pred 文件 RRF。
  #   与现役（0.758）差异：top-1 仅 5 条翻转（O2S 2 / S2O 3 / O2O 0），全为保守重排
  #           （新 top1 均在现役该 query top-10 内、零池外新增），平均交集 9.63/10 —— 同 exp_008 的 S5 中性特征。
  #   预期 +0.02（S5 在 8 成员官方实测 0.74→0.76，唯一被官方证真的增益；本次规避了 exp_008 盲成员入 RRF 层之坑）。
  #   回退：prediction.json 回滚 prediction_wave11_0758_bak.json（波次11，sha 9C7A42B9…）。
  #   2026-10-13 补充：S5 配方已入库 scripts/s5_rebuild.py（--fidelity 重跑 267/267 逐位复现 sha 237F1E77 部署物）。
  active: final_full_b75_cm_dino_nocnxs_dir

  # 权重预设：预设名 -> {成员名: 权重}
  # 顺序即融合时成员与权重的绑定顺序，由 Python 侧读取，不经命令行
  presets:
    # 当前采用：5 个等权成员（1.0）+ 1 个小权重成员（0.5）+ 深 top-100 成员排名 + k=3
    # 本地验证 Final 0.6800（b1_topk_probe 折口径：fold0 0.6972 / fold1 0.6628）
    # 成员搭配沿袭 K=10 时代的结论：MOS ep75 替换 E0 ep80（单模 0.6118 > 0.5888，异构损失）
    # （五成员方案 MOS75+E0_80+45+25+sv 已复核为负：0.6373，增量 0.0010 < 0.003，故不加 E0_80）
    # 波次2 新增 ship_reid_convnext_t（ConvNeXt-Tiny 双分支 ep80，单模本地验证 0.5186 > shipvit 0.4815）：
    #   +0.0270（0.6465->0.6735），k=1~10 两折恒为正；Swin-T 叠加后 Final 反降 0.0048，ResNet50 全线两折为负，均按铁律淘汰
    # 波次3 新增 ship_reid_convnext_s（ConvNeXt-Small 双分支 ep60，单模本地验证 0.5089）：小权重 0.5
    #   +0.0065（0.6735->0.6800），两折增益 +0.0085/+0.0045（同时 >= 0.003）；O2S +0.0073 / S2O +0.0070 双方向同向上涨
    #   （CLIP-ViT-B 全线两折为负或 ≈0，最高 +0.0004，按铁律淘汰）
    # 波次4 新增两个「强配方」（w_cm_infonce/triplet 0.3->1.0，方向对称）成员：
    #   ship_reid_convnext_s_pure（ConvNeXt-Small ep40，单模 0.5472）+ ship_reid_swin_s_v2（Swin-Small ep60，单模 0.5547）
    #   单独任一入集都卡 G2（k 扫描出现负值）；二者同时以 0.75 / 1.0 权入集后互相修补 k 空洞：
    #   Final 0.6800->0.6905（+0.0105），fold0 +0.0074 / fold1 +0.0136；O2S +0.0080 / S2O +0.0158 / O2O -0.0018
    #   G2 全 k 为正（min +0.0047）；三种折分割（parity/前后半/相位4）G1 全部双折 >= +0.003；权重邻域呈内部极值
    final:
      sdfnet_mos75: 1.0
      sdfnet_ep45: 1.0
      sdfnet_ep25: 1.0
      ship_reid_vit: 1.0
      ship_reid_convnext_t: 1.0
      ship_reid_convnext_s: 0.5
      ship_reid_convnext_s_pure: 0.75
      ship_reid_swin_s_v2: 1.0

    # 波次5（2026-10-09，当前 active）：8 成员全部改用官方全量 labels.csv（3534 身份/7422 图）重训
    #   动机：exp_005 受控嵌套双折（训练身份 2122→2828，同配方同 seed）单模 Final +0.0669/+0.0333
    #         两折同向、O2S/S2O 四格全正；外推 2828→3534（+25%，边际递减区）期望 +0.02~+0.04。
    #   注意：全量重训成员已见过全部 3534 身份，**不存在无泄漏本地验证**，故本预设属盲提交；
    #         配方/骨干/PK/seed 与 final 对应成员逐项一致，仅训练身份数变化，取点沿用冠军 epoch；
    #         k=3 / member_topk=100 / 权重 [1,1,1,1,1,0.5,0.75,1] 全部沿用 final（无法重新调参）。
    #   成员名后缀 _full = 全量数据版；final（2828 身份版，Final 0.6905）保留作回滚。
    final_full:
      sdfnet_mos75_full: 1.0
      sdfnet_ep45_full: 1.0
      sdfnet_ep25_full: 1.0
      ship_reid_vit_full: 1.0
      ship_reid_convnext_t_full: 1.0
      ship_reid_convnext_s_full: 0.5
      ship_reid_convnext_s_pure_full: 0.75
      ship_reid_swin_s_v2_full: 1.0

    # 波次6（2026-10-11，当前 active）：final_full 8 成员 + 队友 base75 互补成员（9 成员）
    #   base75：ship_reid_system/outputs/ab75 训练配方（base75_best.pth），本地验证综合 0.5985，
    #   与冠军路线同域互补（SDF-Net 系异构训练配方），top-100 排名文件已生成（267×100 无重复）。
    #   权重初值 1.0（同域锚点级别）；k=3 / member_topk=100 沿用，无法本地调参（盲提交）。
    #   final_full（8 成员版）保留作回滚。
    final_full_b75:
      sdfnet_mos75_full: 1.0
      sdfnet_ep45_full: 1.0
      sdfnet_ep25_full: 1.0
      ship_reid_vit_full: 1.0
      ship_reid_convnext_t_full: 1.0
      ship_reid_convnext_s_full: 0.5
      ship_reid_convnext_s_pure_full: 0.75
      ship_reid_swin_s_v2_full: 1.0
      sdfnet_base75: 1.0

    # 波次7（2026-10-12，候选，未切 active）：final_full_b75 + 强配方全量成员（10 成员）
    #   依据 exp_010 结论 B（k=3 生产口径，只看总体分）：convnext_t 软化到 0.5、
    #   追加强配方@1.0，2828 口径 local Final 0.6905->0.6966（+0.0061），三方向全非负。
    #   本预设把同方案迁移到全量 active 口径；因全量成员已见全部身份，**无无泄漏本地验证**（盲）。
    #   验证方式：17_submit_4_rrf_fuse.bat --preset final_full_b75_cm --out ../prediction_cm.json
    #   确认优于 final_full_b75 后再改 ensemble.active。
    final_full_b75_cm:
      sdfnet_mos75_full: 1.0
      sdfnet_ep45_full: 1.0
      sdfnet_ep25_full: 1.0
      ship_reid_vit_full: 1.0
      ship_reid_convnext_t_full: 0.5
      ship_reid_convnext_t_strong_cm_full: 1.0
      ship_reid_convnext_s_full: 0.5
      ship_reid_convnext_s_pure_full: 0.75
      ship_reid_swin_s_v2_full: 1.0
      sdfnet_base75: 1.0

    # 波次8（2026-10-12，候选）：final_full_b75_cm 10 成员 + DINOv2-B ep040+ep060（12 成员）
    #   DINOv2-B 缩水模型（2828 身份）三重门槛已过：ep040+ep060 联合入集 local Final +0.0088（k=3）
    #   ViT+DINOv2 预训练权重带来独特架构多样性（现役无 ViT 骨干成员）。
    #   推理只用特征（与训练身份数无关），2828 缩水模型可直接用于测试集推理。
    #   验证：scripts/repro_cfg.py fuse --preset final_full_b75_cm_dino --out ../prediction_dino.json
    final_full_b75_cm_dino:
      sdfnet_mos75_full: 1.0
      sdfnet_ep45_full: 1.0
      sdfnet_ep25_full: 1.0
      ship_reid_vit_full: 1.0
      ship_reid_convnext_t_full: 0.5
      ship_reid_convnext_t_strong_cm_full: 1.0
      ship_reid_convnext_s_full: 0.5
      ship_reid_convnext_s_pure_full: 0.75
      ship_reid_swin_s_v2_full: 1.0
      sdfnet_base75: 1.0
      ship_reid_dinov2_b_ep040: 1.0
      ship_reid_dinov2_b_ep060: 1.0

    # 波次9（2026-10-12，候选）：final_full_b75_cm_dino 剪枝 —— 删除最弱成员 cnx_s（11 成员）
    #   依据（无泄漏 2828 口径 local_val，11 成员同构子集）：
    #     LOO 单删 cnx_s +0.0066（fold0 +0.0062 / fold1 +0.0070，双折过 G1 门槛 >=0.003）；
    #     折验证贪心后向剪枝第一步亦为删除 cnx_s；嵌套留出验证（在一半上选、另一半评估）
    #     parity 两向均正（held-out fold1 +0.0038 / held-out fold0 +0.0093），非选择偏差。
    #   原理：cnx_s（ConvNeXt-Small w_cm=0.3，权 0.5）与更强的同骨干 cnx_s_pure（w_cm=1.0，权 0.75）
    #         功能重叠，且强配方成员引入后其边际贡献被吸收。
    #   剪枝后 k 重扫：k=10 仍为峰值（0.7079），权重扰动均无正增益，故 k=10 / 其余权重全部沿用。
    #   仅删一个成员、改动最小；base75 无 local_val sim 无法评估，按现状保留。
    #   验证：scripts/repro_cfg.py fuse --preset final_full_b75_cm_dino_nocnxs --out ../prediction_pruned.json
    final_full_b75_cm_dino_nocnxs:
      sdfnet_mos75_full: 1.0
      sdfnet_ep45_full: 1.0
      sdfnet_ep25_full: 1.0
      ship_reid_vit_full: 1.0
      ship_reid_convnext_t_full: 0.5
      ship_reid_convnext_t_strong_cm_full: 1.0
      ship_reid_convnext_s_pure_full: 0.75
      ship_reid_swin_s_v2_full: 1.0
      sdfnet_base75: 1.0
      ship_reid_dinov2_b_ep040: 1.0
      ship_reid_dinov2_b_ep060: 1.0

    # 波次10（2026-10-12，候选）：方向特异性融合 —— 仅 O2S 方向覆盖 3 个成员权重（per_direction）
    #   依据（无泄漏 2828 local_val 口径，删去无 sim 的 base75 后 10 成员同构子集）：
    #     方向贡献矩阵（单模强度 / LOO / 权重扫描）显示 O2S 侧存在明确方向偏好 ——
    #       mos75（最强 SAR 侧单模 0.5810）1.0->1.5；shipvit（O2S 最弱单模 0.4257）1.0->0.5；
    #       cnx_t（O2S 净拖累，LOO +0.0042）0.5->0.25；S2O/O2O 维持基线（S2O 无稳健单参数信号，
    #       O2O 仅 38 query 且已近饱和 0.9781，杠杆 <= 0.002）。
    #     门槛：full +0.0042；parity/halves/phase4 三种折分割双折全部 >= +0.003；
    #       k∈{1,3,5,7,10,15,20,40} 全 k 全折为正（min +0.0002）；3 参数受限嵌套（fold0<->fold1 互换）双正。
    #     对照（均已弃用）：13 参数全向坐标下降 +0.0129 但嵌套留出为负（-0.0025，过拟合）；
    #       变体 C（cnx_t 保持 0.5）+0.0049、D5/D6（追加 ep45/cnx_s_pure）+0.0018/+0.0021 均未过全部门槛。
    #   验证：scripts/repro_cfg.py fuse --preset final_full_b75_cm_dino_nocnxs_dir --out ../prediction_dir.json
    final_full_b75_cm_dino_nocnxs_dir:
      sdfnet_mos75_full: 1.0
      sdfnet_ep45_full: 1.0
      sdfnet_ep25_full: 1.0
      ship_reid_vit_full: 1.0
      ship_reid_convnext_t_full: 0.5
      ship_reid_convnext_t_strong_cm_full: 1.0
      ship_reid_convnext_s_pure_full: 0.75
      ship_reid_swin_s_v2_full: 1.0
      sdfnet_base75: 1.0
      ship_reid_dinov2_b_ep040: 1.0
