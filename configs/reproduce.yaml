    # 波次14（2026-10-13，候选，未切 active）：现役 11 成员，仅 shipvit_full -> shipvit_full_ms
    #   其余 10 成员、权重、k=10、O2S 方向覆盖全部沿用波次11 现役；唯一变量 = shipvit 的
    #   特征提取协议（base -> tta+rerank+multiscale 0.7/0.2/0.1，含 tta+rerank 不变）。
    #   证据见成员池 ship_reid_vit_full_ms 注释（缩水成员消融 +0.0094，三折分割 G1 全过）。
    #   验证：scripts/repro_cfg.py fuse --preset final_full_b75_cm_dino_nocnxs_dir_ms --out ../prediction_ms_shipvit.json
    #   路线2（保 S5 层，推荐）：scripts/s5_rebuild.py --emit-ms -> prediction_s5_ms.json（sha 224AC35C…）
    #     = S5 配方（--fidelity 267/267 复现）下 shipvit 同步换 ms（基座 pred + 稠密 sim），
    #       top-1 翻转 9 条 vs 现役（S5 自身 5 条 + ms 追加 4 条），全部落在现役 top-10 内（保守重排）；
    #       ms 稠密 sim = sims/test_rerank_full_ms/sim_shipvit_full_ms.pt（tta+rerank+multiscale 0.7/0.2/0.1）。
    #   注：ms 仅改 shipvit 推理协议，其 checkpoint/训练数据与现役相同（非波次12 型「新盲权重」）。
    final_full_b75_cm_dino_nocnxs_dir_ms:
      sdfnet_mos75_full: 1.0
      sdfnet_ep45_full: 1.0
      sdfnet_ep25_full: 1.0
      ship_reid_vit_full_ms: 1.0
      ship_reid_convnext_t_full: 0.5
      ship_reid_convnext_t_strong_cm_full: 1.0
      ship_reid_convnext_s_pure_full: 0.75
      ship_reid_swin_s_v2_full: 1.0
      sdfnet_base75: 1.0
      ship_reid_dinov2_b_ep040: 1.0
      ship_reid_dinov2_b_ep060: 1.0
      per_direction:
        O2S:
          sdfnet_mos75_full: 1.5
          ship_reid_vit_full_ms: 0.5
          ship_reid_convnext_t_full: 0.25

    # 波次12（2026-10-12，候选，未切 active）：波次11 现役 11 成员，仅把 dino 两成员换成全量重训版
    #   动机：screen dino（2828 身份）是现役唯一「缩水训练口径」成员；全量版同配方/同 seed、
    #     仅训练身份数 2828->3534（沿波次5 全量重训先例）。全量成员已见全部身份 → **盲提交、无本地验证**。
    #   其余 9 成员、权重、k=10、per_direction O2S 覆盖全部沿用波次11 现役；本地分不可比，只能盲测。
    #   对照：现役 prediction.json（波次11，sha 9C7A42B9…）；回退只需把 dino 两成员 pred 指回 _v2 文件。
    #   验证：scripts/repro_cfg.py fuse --preset final_full_b75_cm_dino_full_nocnxs_dir --out ../prediction_dino_full.json
    final_full_b75_cm_dino_full_nocnxs_dir:
      sdfnet_mos75_full: 1.0
      sdfnet_ep45_full: 1.0
      sdfnet_ep25_full: 1.0
      ship_reid_vit_full: 1.0
      ship_reid_convnext_t_full: 0.5
      ship_reid_convnext_t_strong_cm_full: 1.0
      ship_reid_convnext_s_pure_full: 0.75
      ship_reid_swin_s_v2_full: 1.0
      sdfnet_base75: 1.0
      ship_reid_dinov2_b_full_ep040: 1.0
      ship_reid_dinov2_b_full_ep060: 1.0
      per_direction:
        O2S:
          sdfnet_mos75_full: 1.5
          ship_reid_vit_full: 0.5
          ship_reid_convnext_t_full: 0.25

    # 回退选项：仅锚点 + 异构分支
    # 注意：成员池里的 ship_reid_vit 已切到 top-100 文件，而 sdfnet_ep80 仍是 top-10，
    #       本预设因此是「混深度」，历史上的 0.6069（K=10/k=10）不再适用；
    #       若需复现旧口径，请把 shipvit_pred 指回 ship_reid_vit/outputs/prediction.json 并设 k=10。
    anchor_plus_sv:
      sdfnet_ep80: 1.0
      ship_reid_vit: 1.0

    # 多成员方案示例（未评测，仅演示改权重/增删成员）
    # anchor_heavy:
    #   sdfnet_ep80: 2.0
    #   sdfnet_ep45: 1.0
    #   sdfnet_ep25: 1.0
    #   ship_reid_vit: 1.0

  # 成员池：定义一次，被预设按名引用
  #   ckpt  相对 sdf_checkpoint_dir（留空 = 复用已有预测、不做本地推理）
  #   pred  该成员输出的预测 json（相对工程根目录）
  members:
    - name: sdfnet_mos75         # 锚点：MOS CMAL 重训最优（0.6118，E0 为 0.5888）
      ckpt: h:/Ship-Re-Identification/Multi-source-Satellite-Cross-modal-Ship-Re-Identification-main/logs/SDF-Net-mos/transformer_75.pth
      pred: sims/test/top100_mos75.json
    - name: sdfnet_ep80          # 旧锚点（0.5888），已被 sdfnet_mos75 替换；保留在池中以便回退
      ckpt: transformer_80.pth
      pred: sims/test/pred_ep80.json
    - name: sdfnet_ep45          # 两折交叉验证下最稳定的伙伴（0.0079 / 0.0073）
      ckpt: transformer_45.pth
      pred: sims/test/top100_ep45.json
    - name: sdfnet_ep25          # 次稳定伙伴
      ckpt: transformer_25.pth
      pred: sims/test/top100_ep25.json
    - name: ship_reid_vit        # 异构分支，提供跨架构多样性（纯特征推理）
      ckpt: ""
      pred: sims/test/top100_shipvit.json
      vit_config: config/train_vit.yaml                    # 相对 shipvit_dir；由 16 号自动推理
      vit_ckpt: outputs/checkpoints/best.pth               # 相对 shipvit_dir
    - name: ship_reid_convnext_t # 波次2 新骨干：ConvNeXt-Tiny 双分支 ep80（纯特征推理）
      ckpt: ""
      pred: sims/test/top100_convnext_t_ep080.json
      vit_config: config/train_convnext_t.yaml             # 必须逐成员指定：split_idx 不在 ckpt 回填白名单内
      vit_ckpt: outputs/screen_convnext_t/checkpoints/epoch_080.pth
    - name: ship_reid_convnext_s # 波次3 新骨干：ConvNeXt-Small 双分支 ep60（纯特征推理）
      ckpt: ""
      pred: sims/test/top100_convnext_s_ep060.json
      vit_config: config/train_convnext_s.yaml             # 必须逐成员指定：split_idx 不在 ckpt 回填白名单内
      vit_ckpt: outputs/screen_convnext_s/checkpoints/epoch_060.pth
    - name: ship_reid_convnext_s_pure # 波次4：强配方（w_cm=1.0 对称）ConvNeXt-Small ep40（纯特征推理）
      ckpt: ""
      pred: sims/test/top100_convnext_s_pure_ep040.json
      vit_config: config/train_convnext_s_pure.yaml        # 必须逐成员指定：split_idx 不在 ckpt 回填白名单内
      vit_ckpt: outputs/screen_convnext_s_pure/checkpoints/epoch_040.pth
    - name: ship_reid_swin_s_v2    # 波次4：强配方（w_cm=1.0 对称）Swin-Small ep60，异构骨干（纯特征推理）
      ckpt: ""
      pred: sims/test/top100_swin_s_v2_ep060.json
      vit_config: config/train_swin_s_v2.yaml              # 必须逐成员指定：split_idx 不在 ckpt 回填白名单内
      vit_ckpt: outputs/screen_swin_s_v2/checkpoints/epoch_060.pth

    # ---- 波次5：全量数据（labels.csv 3534 身份/7422 图）重训版本 ----
    #   与上面对应成员同骨干/同配方/同 seed，唯一变量为训练身份数；
    #   ckpt 取冠军 epoch（vit ep100 / cnx_t ep80 / cnx_s ep60 / pure ep40 / swin_v2 ep60 / SDF-Net ep25、ep45、ep75）
    - name: sdfnet_mos75_full
      ckpt: h:/Ship-Re-Identification/Multi-source-Satellite-Cross-modal-Ship-Re-Identification-main/logs/SDF-Net-mos-full/transformer_75.pth
      pred: sims/test_full/top100_mos75_full.json
    - name: sdfnet_ep45_full
      ckpt: h:/Ship-Re-Identification/Multi-source-Satellite-Cross-modal-Ship-Re-Identification-main/logs/SDF-Net-full/transformer_45.pth
      pred: sims/test_full/top100_ep45_full.json
    - name: sdfnet_ep25_full
      ckpt: h:/Ship-Re-Identification/Multi-source-Satellite-Cross-modal-Ship-Re-Identification-main/logs/SDF-Net-full/transformer_25.pth
      pred: sims/test_full/top100_ep25_full.json
    - name: ship_reid_vit_full
      ckpt: ""
      pred: sims/test_full/top100_shipvit_full.json
      vit_config: config/train_vit_full.yaml
      vit_ckpt: outputs/full_vit/checkpoints/epoch_100.pth
    - name: ship_reid_convnext_t_full
      ckpt: ""
      pred: sims/test_full/top100_convnext_t_ep080_full.json
      vit_config: config/train_convnext_t_full.yaml
      vit_ckpt: outputs/full_convnext_t/checkpoints/epoch_080.pth
    - name: ship_reid_convnext_s_full
      ckpt: ""
      pred: sims/test_full/top100_convnext_s_ep060_full.json
      vit_config: config/train_convnext_s_full.yaml
      vit_ckpt: outputs/full_convnext_s/checkpoints/epoch_060.pth
    - name: ship_reid_convnext_s_pure_full
      ckpt: ""
      pred: sims/test_full/top100_convnext_s_pure_ep040_full.json
      vit_config: config/train_convnext_s_pure_full.yaml
      vit_ckpt: outputs/full_convnext_s_pure/checkpoints/epoch_040.pth
    - name: ship_reid_swin_s_v2_full
      ckpt: ""
      pred: sims/test_full/top100_swin_s_v2_ep060_full.json
      vit_config: config/train_swin_s_v2_full.yaml
      vit_ckpt: outputs/full_swin_s_v2/checkpoints/epoch_060.pth

    # ---- 波次14（2026-10-13）：Phase 1 多尺度特征融合，仅 shipvit 成员 ----
    #   依据（缩水成员无泄漏 local_val 消融：8 成员 RRF、k=10、member_topk=100 生产口径，
    #   scripts/phase1_ensemble_ab.py，成员排名 sims/localval_ab/）：
    #     5 个 ship_reid 成员全量换 ms：Final 0.6874->0.6831（-0.0043）——同质化代价：
    #       成员两两 top-1 一致率 0.3867->0.4110，ConvNeXt/Swin 家族趋于雷同。
    #     仅 shipvit 换 ms：Final +0.0094；parity/halves/phase4 三种折分割双折增益 min +0.0067
    #       （全部 >= +0.003）；k∈{3,5,7,10,15} 为正（k=10 = +0.0074），仅 k=40 微负（-0.0011）；
    #       32 子集扫描 16/16「含 shipvit」为正、16/16「不含 shipvit」为负（符号系统性，非单点噪声）。
    #   生成命令（必须带 ms 参数；16 号脚本不会自动加）：
    #     ship_reid_vit\inference.py --config config/train_vit_full.yaml
    #       --ckpt outputs/full_vit/checkpoints/epoch_100.pth --use_test_task --topk 100
    #       --tta --rerank --multiscale --ms_weights 0.7 0.2 0.1
    #       --out_prediction sims/test_full/ms_top100_shipvit_full.json
    #   单模证据（同协议 tta+rerank）：shipvit 0.4877->0.5041（+0.0164，5 成员中最大）
    - name: ship_reid_vit_full_ms
      ckpt: ""
      pred: sims/test_full/ms_top100_shipvit_full.json
      vit_config: config/train_vit_full.yaml
      vit_ckpt: outputs/full_vit/checkpoints/epoch_100.pth

    # ---- 波次7：全量数据 + 强跨模态配方（w_cm=1.0 对称）ConvNeXt-Tiny ep80 ----
    #   exp_010 已证明「强配方 × ConvNeXt-T」在 2828 口径把单模 0.5186->0.5345，
    #   集成方案 convnext_t@0.5 + 强配方@1.0 在 k=3 生产口径 local Final +0.0061（三方向全非负）。
    #   本成员为该配方的全量(3534 身份)版，供并入 active 全量提交使用（盲）。
    #   对照：ship_reid_convnext_t_full（同骨干 w_cm=0.3 全量基线）
    - name: ship_reid_convnext_t_strong_cm_full
      ckpt: ""
      pred: sims/test_full/top100_convnext_t_strong_cm_full.json
      vit_config: config/train_convnext_t_strong_cm_full.yaml
      vit_ckpt: outputs/full_convnext_t_strong_cm/checkpoints/epoch_080.pth

    # 波次6：队友 base75 互补成员（ab75 配方，本地验证综合 0.5985）
    #   pred 为 test 集 top-100 排名（267×100 无重复）；sim 备份 sims/test_base75_sim.pt
    #   ckpt 置空（2026-10-18）：权重在队友 D 盘、本机不存在。
    #     置空后 15 号不再尝试推理该成员，14 号环境自检不再报 MISS，改由 pred 存在性把关。
    #   队友原始 ckpt 路径备查：
    #     D:/Projects/Multi-source Satellite Cross-modal Ship Re-Identification/ship_reid_system/outputs/ab75/base75_best.pth
    - name: sdfnet_base75
      ckpt: ""
      pred: sims/test/top100_base75.json

    # ---- 波次8：DINOv2-B 缩水模型（2828 身份，三重门槛已过）----
    #   ep040 单追过 G1+G2（k=3 +0.0067，min +0.0025）；ep040+ep060 联合过 G1+G2（k=3 +0.0088，min +0.0020）
    #   单模最佳 ep040 Final=0.5829（史上第二单模）。ViT+DINOv2 预训练权重带来独特架构多样性。
    #   推理只用特征（与训练身份数无关），2828 缩水模型可直接用于测试集推理。
    # 波次11（2026-10-12）协议修复：dino 两成员的测试侧排名由 base 纯特征改为 tta+rerank
    #   动机：全队唯一协议异类 —— 其余 9 个成员文件均为 tta+rerank 产物（16 号脚本同款命令；
    #     sims/test_rerank 批次 sim 可将其 top-100 精确重现 267/267），而 dino v1 文件经逐位复现
    #     核实为其 checkpoint 的 base 协议原生输出（267/267 top-100 全等）。
    #   前车之鉴：首版修复误引 10-10 遗留的 sims/test_rerank/sim_dinov2_b_ep0XX.pt；时间线核查
    #     证明该快照模型已被 10-12 重训的 checkpoint 取代（screen ckpt 16:44~17:22 重写、
    #     sims/screen_dinov2_b 17:29 为 10-12 版），故弃用，改为当前 checkpoint 的原生输出：
    #     ship_reid_vit\inference.py --config config/train_dinov2_b.yaml --use_test_task
    #         --topk 100 --tta --rerank --out_prediction sims/test_full/top100_dinov2_b_ep0XX_v2.json
    #   同快照 local_val 量化（10 成员子集 + O2S 方向覆盖，parity 折，k=10 生产口径；
    #     base 协议对照 sim 见 sims/localval_dino_base/）：
    #     Δ(rerank−base)=+0.0037（fold0 +0.0087 / fold1 −0.0013）；方向 −0.0035/+0.0069/+0.0219
    #     （O2O 仅 38q，方差大）；k∈{7,10,15,40} 为正、{1,3,5,20} 为负/零 —— 幅度小、k 敏感，
    #     不作强增益声明。反证：ep040 单模 base 0.5961 > rerank 0.5829；测试侧 top1 共识
    #     base 0.597/0.581 > rerank 0.539/0.566。
    #   决策：协议一致性优先（其余 9 成员 + 全部 local_val 调参环境均为 tta+rerank，含 dino 自身
    #     入选门槛），且生产 k=10 同向为正。回退：pred 改回 sims/test_full/top100_dinov2_b_ep0XX.json
    #     （base 版；或 prediction.json 回滚 prediction_11m_dir_k10_bak.json）。
    #   波次11 部署 sha256=9C7A42B9AE33AC4F7511DA5D507E62F2D481EBE16E5B5CF2B4FFE9533D50D042
    - name: ship_reid_dinov2_b_ep040
      ckpt: ""
      pred: sims/test_full/top100_dinov2_b_ep040_v2.json
      vit_config: config/train_dinov2_b.yaml
      vit_ckpt: outputs/screen_dinov2_b/checkpoints/epoch_040.pth
    - name: ship_reid_dinov2_b_ep060
      ckpt: ""
      pred: sims/test_full/top100_dinov2_b_ep060_v2.json
      vit_config: config/train_dinov2_b.yaml
      vit_ckpt: outputs/screen_dinov2_b/checkpoints/epoch_060.pth

    # ---- 波次12（2026-10-12）：DINOv2-B 全量重训版（labels.csv 3534 身份/7422 图）----
    #   与 screen 版（config/train_dinov2_b.yaml）同配方/同 seed，唯一变量为训练身份数
    #   （2828 -> 3534），沿波次5 全量重训先例；全量成员已见全部身份 → **盲、无无泄漏本地验证**。
    #   取点沿用 screen 版冠军 epoch（ep040/ep060）；测试侧 top-100 用生产协议（tta+rerank）生成：
    #     ship_reid_vit\inference.py --config config/train_dinov2_b_full.yaml
    #         --use_test_task --topk 100 --tta --rerank --out_prediction sims/test_full/top100_dinov2_b_full_ep0XX.json
    #   用途：候选预设 final_full_b75_cm_dino_full_nocnxs_dir 替换 screen dino 两成员；不改现役。
    - name: ship_reid_dinov2_b_full_ep040
      ckpt: ""
      pred: sims/test_full/top100_dinov2_b_full_ep040.json
      vit_config: config/train_dinov2_b_full.yaml
      vit_ckpt: outputs/full_dinov2_b/checkpoints/epoch_040.pth
    - name: ship_reid_dinov2_b_full_ep060
      ckpt: ""
      pred: sims/test_full/top100_dinov2_b_full_ep060.json
      vit_config: config/train_dinov2_b_full.yaml
      vit_ckpt: outputs/full_dinov2_b/checkpoints/epoch_060.pth

# 仅用于 18 号脚本回显本地验证基准，不参与流程
# 折切分口径：scripts/b1_topk_probe.py::fold_split（各方向内部 folds[i % 2]，725/725）
