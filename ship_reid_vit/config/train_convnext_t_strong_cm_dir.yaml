# ============================================================
# Phase 4 方向特异性非对称投影头实验配置 - ConvNeXt-T 强配方
# 基于 train_convnext_t_strong_cm.yaml，仅改动：
#   directional_projection: true   # 启用方向特异性投影头
#   output_dir: 改为 screen_convnext_t_strong_cm_dir
# 动机：Phase 4 方案 D，为 O2S / S2O 方向各学习一个轻量级投影，
# 预期提升方向特定判别能力，本地验证 fold 需 >= +0.003 才入集。
# 用法：python train.py --config config/train_convnext_t_strong_cm_dir.yaml
# ============================================================

# ---------- 基础 ----------
seed: 42
device: cuda
project_name: ship_reid_convnext_t_strong_cm_dir

# ---------- 数据（真实路径） ----------
data_root: ../../question6-data/traindata
train_labels_csv: ../../question6-data/traindata/labels_train.csv
val_labels_csv: ""
test_task_json: ../../question6-data/preliminary-round-test-data/task.json
local_val_task_json: ../../question6-data/traindata/local_val_task.json
local_val_gt_json: ../../question6-data/traindata/local_val_gt.json
auto_num_classes: true

# ---------- 数据加载 ----------
image_size: 224
num_workers: 0    # Windows 共享内存限制
# 模态独立归一化（由 02_prepare_data.bat -> compute_stats.py 实测）
optical_mean: [0.1709, 0.2070, 0.2151]
optical_std: [0.1967, 0.1956, 0.1908]
sar_mean: [0.0242, 0.0242, 0.0242]
sar_std: [0.1214, 0.1214, 0.1214]
sar_speckle_aug: true
sar_scatter_aug: false

# ---------- PK 采样 ----------
pk_p: 80
pk_k: 2
pk_prefer_dual_modal: true
pk_sampler: cross_modal

# ---------- 模型（ConvNeXt-Tiny 双分支） ----------
backbone: convnext_tiny
pretrained: true
pretrained_path: ""
split_idx: 2
embedding_dim: 0
modality_projection: false
directional_projection: true    # Phase 4：方向特异性投影头
w_directional: 0.3              # Phase 4：方向辅助 InfoNCE 权重（>0 时投影头才有梯度）

# ---------- 损失 ----------
w_supcon: 0.5
w_triplet: 0.3
w_ce: 1.0
w_arcface: 0.3
arcface_scale: 30.0
arcface_margin: 0.5
supcon_temperature: 0.07
triplet_margin: 0.3
label_smooth: 0.1
w_cm_infonce: 1.0
w_cm_triplet: 1.0
cm_temperature: 0.07
cm_margin: 0.3

# ---------- 训练 ----------
epochs: 100
lr: 0.0006
backbone_lr_scale: 0.1
weight_decay: 0.0005
scheduler: cosine
warmup_epochs: 3
ema_decay: 0.999
amp: true
resume: ""

# ---------- 输出 ----------
output_dir: outputs/screen_convnext_t_strong_cm_dir
log_interval: 20
eval_interval: 1
tb_enabled: false
save_every: 20

# ---------- 推理 ----------
topk: 10
test_batch_size: 64
