# ============================================================
# 强跨模态配方 - DINOv2-B 双分支（缩水无泄漏筛选口径）
# 复制自 config/train_convnext_s_pure.yaml，仅改：backbone、pk_p/pk_k、
# lr、project_name、output_dir；强配方（w_cm=1.0 对称）逐项不动。
#
# 动机：波次6 s1 筛选已证明 DINOv2-B 强配方在 2828 口径单模 0.5936（史上
#       第二单模），ep040+ep060 联合入集 local Final +0.0139（过三重门槛）。
#       本配置重建该权重供在新基座（含 strong_cm）上重新验证门槛。
# 骨干：vit_base_patch14_dinov2.lvd142m（原生 518，img_size=224 时 timm
#       自动重采样 pos_embed）
# 口径：labels_train.csv（2828 身份）与 local_val(1450 query/706 身份) 不重叠，
#       无泄漏，可走三重门槛 G1/G2。
# 显存：bs=96 @224 峰值 ~12GB / 308 img/s（RTX 4070Ti SUPER 16GB）
# 用法：python train.py --config config/train_dinov2_b.yaml
# ============================================================

# ---------- 基础 ----------
seed: 42
device: cuda
project_name: ship_reid_dinov2_b_screen

# ---------- 数据（真实路径） ----------
data_root: ../../question6-data/traindata
train_labels_csv: ../../question6-data/traindata/labels_train.csv
val_labels_csv: ""
test_task_json: ../../question6-data/preliminary-round-test-data/task.json
local_val_task_json: ../../question6-data/traindata/local_val_task.json
local_val_gt_json: ../../question6-data/traindata/local_val_gt.json
auto_num_classes: true

# ---------- 数据加载 ----------
image_size: 224
num_workers: 4
# 模态独立归一化（由 02_prepare_data.bat -> compute_stats.py 实测）
optical_mean: [0.1709, 0.2070, 0.2151]
optical_std: [0.1967, 0.1956, 0.1908]
sar_mean: [0.0242, 0.0242, 0.0242]
sar_std: [0.1214, 0.1214, 0.1214]
sar_speckle_aug: true

# ---------- PK 采样（bs=96 = pk_p=48 * pk_k=2） ----------
pk_p: 48
pk_k: 2
pk_prefer_dual_modal: true
pk_sampler: cross_modal

# ---------- 模型（DINOv2-B 双分支 ViT） ----------
backbone: vit_base_patch14_dinov2.lvd142m
pretrained: true
pretrained_path: ""
vit_split_layer: 6          # 前 6 个 block 为模态特定，其余共享
embedding_dim: 0
modality_projection: false

# ---------- 损失（强跨模态配方 w_cm=1.0 对称，与 convnext_s_pure 一致） ----------
w_supcon: 0.5
w_triplet: 0.3
w_ce: 1.0
w_arcface: 0.3
arcface_scale: 30.0
arcface_margin: 0.5
supcon_temperature: 0.07
triplet_margin: 0.3
label_smooth: 0.1
w_cm_infonce: 1.0
w_cm_triplet: 1.0
cm_temperature: 0.07
cm_margin: 0.3
cm_dir_w_os: 1.0
cm_dir_w_so: 1.0

# ---------- 训练 ----------
epochs: 100
lr: 0.00046
backbone_lr_scale: 0.1
weight_decay: 0.0005
scheduler: cosine
warmup_epochs: 3
ema_decay: 0.999
amp: true
resume: ""

# ---------- 输出 ----------
output_dir: outputs/screen_dinov2_b
log_interval: 20
eval_interval: 1
tb_enabled: false
save_every: 20            # ep20/40/60/80/100 供逐点取用

# ---------- 推理 ----------
topk: 10
test_batch_size: 64
