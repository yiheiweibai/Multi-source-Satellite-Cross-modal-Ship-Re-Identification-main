# 2026 全国大数据与计算智能挑战赛 · 赛题06 多源卫星跨模态舰船重识别
# ship_reid_vit 默认配置（ViT 骨干 · CPU 冒烟/小规模可用）
# 命令行 --config 传入自定义 yaml 时，仅覆盖此处列出的字段。

# ---------- 基础 ----------
seed: 42
device: cuda            # cuda / cpu（不可用时自动回退 cpu）
project_name: ship_reid_vit

# ---------- 数据路径（相对于工程根目录） ----------
# CSV 模式（官方 labels.csv）：image_path 相对 csv 所在数据包根目录，
#   ship_id 自动映射为连续整数；身份数由数据集自动推断。
data_root: ../../question6-data/traindata
train_labels_csv: ../../question6-data/traindata/labels_train.csv
val_labels_csv: ""      # 留空则训练时不做内部验证（用 04_local_val.bat 走检索评测）
test_task_json: ../../question6-data/preliminary-round-test-data/task.json
local_val_task_json: ../../question6-data/traindata/local_val_task.json   # 02_prepare_data.bat 生成
local_val_gt_json: ../../question6-data/traindata/local_val_gt.json       # 02_prepare_data.bat 生成
max_samples: 0          # >0 时只取前 N 个样本（冒烟/调试用，0=全部）
auto_num_classes: true  # 训练身份数由数据集自动推断

# ---------- 数据加载 ----------
image_size: 224         # ViT 骨干固定 224（ResNet 用 256）
num_workers: 4
sar_speckle_aug: true   # 训练时对 SAR 模拟斑点噪声
# 模态独立归一化（由 02_prepare_data.bat -> compute_stats.py 实测）
optical_mean: [0.1709, 0.2070, 0.2151]
optical_std: [0.1967, 0.1956, 0.1908]
sar_mean: [0.0242, 0.0242, 0.0242]
sar_std: [0.1214, 0.1214, 0.1214]
sar_color_jitter: false   # SAR 禁用 ColorJitter，改用强度抖动

# ---------- PK 采样 ----------
pk_p: 8
pk_k: 4
pk_prefer_dual_modal: true
pk_sampler: cross_modal   # cross_modal=模态均衡 PK（默认）/ pk=普通 PK

# ---------- 模型（ViT 优先） ----------
backbone: vit_base_patch16_224   # vit_base_patch16_224 / resnet50
pretrained: true
pretrained_path: weights/vit_base_patch16_224.pth   # 由 01_setup.bat 下载；缺失则回退 timm 在线权重
vit_split_layer: 6       # 前 6 个 block 模态特定，其余共享
share_layer: layer3      # 仅 ResNet 生效
embedding_dim: 0         # 检索特征维度（0 = 骨干输出维度）
modality_projection: false  # 模态感知投影头开关（路线 ③）

# ---------- 损失（路线 ②③：显式跨模态对齐，默认关闭） ----------
w_supcon: 0.5
w_triplet: 0.3
w_ce: 1.0
w_arcface: 0.0
arcface_scale: 30.0
arcface_margin: 0.5
supcon_temperature: 0.07
triplet_margin: 0.3
adaptive_margin: false
label_smooth: 0.1
w_cm_infonce: 0.0        # 跨模态 InfoNCE 权重（>0 启用）
w_cm_triplet: 0.0        # 跨模态 hard triplet 权重（>0 启用）
cm_temperature: 0.07
cm_margin: 0.3

# ---------- 训练 ----------
epochs: 10               # 冒烟用；正式训练见 config/train_vit.yaml
lr: 0.0003
backbone_lr_scale: 0.1
weight_decay: 0.0005
scheduler: cosine
total_steps: 0
warmup_epochs: 1
ema_decay: 0.999
use_ema: true
amp: true
resume: ""

# ---------- 输出 ----------
output_dir: outputs
log_interval: 20
eval_interval: 1
tb_enabled: true

# ---------- 推理 ----------
topk: 10
test_batch_size: 64