# ============================================================
# 强跨模态配方 - ConvNeXt-Tiny 双分支（缩水无泄漏筛选口径）
# 复制自 config/train_convnext_t.yaml，仅改：w_cm_infonce 0.3->1.0、
# w_cm_triplet 0.3->1.0、project_name、output_dir；其余逐项不动。
#
# 动机：数据侧（外部 SSL / 合成翻译 / HOSS 混训）已系统性死于域失配；
#       训练侧唯一被证明有效的活杠杆 = 强跨模态损失（波次4 convnext_s_pure /
#       swin_s_v2 用 w_cm=1.0 方向对称，Final +0.0105）。ConvNeXt-T 是现役
#       最强 shipvit 单模（缩水 0.5186），却从未用过强配方 -> 唯一未穷尽组合。
# 口径：labels_train.csv（2828 身份）与 local_val(1450 query/706 身份) 不重叠，
#       无泄漏，可走三重门槛 G1/G2。
# 对照：outputs/screen_convnext_t（同配方 w_cm=0.3，ep080 = 0.5186）
# 用法：python train.py --config config/train_convnext_t_strong_cm.yaml
# ============================================================

# ---------- 基础 ----------
seed: 42
device: cuda
project_name: ship_reid_convnext_t_strong_cm

# ---------- 数据（真实路径） ----------
data_root: ../../question6-data/traindata
train_labels_csv: ../../question6-data/traindata/labels_train.csv
val_labels_csv: ""
test_task_json: ../../question6-data/preliminary-round-test-data/task.json
local_val_task_json: ../../question6-data/traindata/local_val_task.json
local_val_gt_json: ../../question6-data/traindata/local_val_gt.json
auto_num_classes: true

# ---------- 数据加载 ----------
image_size: 224
# 12 个 spawn worker 在 Windows 上会各自带走 CUDA 上下文（约 4-5GiB），
# 导致主进程在 batch 160 时 cudaMalloc 失败（表现为"显存空闲却 OOM"）；
# 降到 4 后 batch 160 可正常训练。仅影响数据加载速度，不改变配方。
num_workers: 4
# 模态独立归一化（由 02_prepare_data.bat -> compute_stats.py 实测）
optical_mean: [0.1709, 0.2070, 0.2151]
optical_std: [0.1967, 0.1956, 0.1908]
sar_mean: [0.0242, 0.0242, 0.0242]
sar_std: [0.1214, 0.1214, 0.1214]
sar_speckle_aug: true

# ---------- PK 采样（实测 p=80,k=2 -> batch=160） ----------
pk_p: 80
pk_k: 2
pk_prefer_dual_modal: true
pk_sampler: cross_modal

# ---------- 模型（ConvNeXt-Tiny 双分支） ----------
backbone: convnext_tiny
pretrained: true
pretrained_path: ""
split_idx: 2              # 前 2 个 stage 为模态特定，其余共享
embedding_dim: 0
modality_projection: false

# ---------- 损失（唯一改动：跨模态权重 0.3 -> 1.0，方向对称） ----------
w_supcon: 0.5
w_triplet: 0.3
w_ce: 1.0
w_arcface: 0.3
arcface_scale: 30.0
arcface_margin: 0.5
supcon_temperature: 0.07
triplet_margin: 0.3
label_smooth: 0.1
w_cm_infonce: 1.0
w_cm_triplet: 1.0
cm_temperature: 0.07
cm_margin: 0.3

# ---------- 训练 ----------
# 与基准同配方同轮数（batch 160 时每 epoch ~37 步）
epochs: 100
lr: 0.0006
backbone_lr_scale: 0.1
weight_decay: 0.0005
scheduler: cosine
warmup_epochs: 3
ema_decay: 0.999
amp: true
resume: ""

# ---------- 输出 ----------
output_dir: outputs/screen_convnext_t_strong_cm
log_interval: 20
eval_interval: 1
tb_enabled: false
save_every: 20            # ep20/40/60/80/100 供逐点对照基准

# ---------- 推理 ----------
topk: 10
test_batch_size: 64