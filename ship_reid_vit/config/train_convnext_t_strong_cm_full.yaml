# ============================================================
# 波次7 全量数据 + 强跨模态配方 - ConvNeXt-Tiny 双分支
# 复制自 config/train_convnext_t_strong_cm.yaml（2828 身份强配方），
# 仅改：train_labels_csv（labels_train.csv -> labels.csv = 3534 身份）、
# project_name、output_dir；其余逐项不动（含 num_workers=4，规避 Windows
# spawn worker 的并发 OOM）。
#
# 动机：exp_010 已证明「强跨模态配方(w_cm=1.0 对称) × ConvNeXt-T」在 2828 身份
#       口径上把 convnext_t 单模从 0.5186 提到 0.5345，integrate 方案
#       「convnext_t@0.5 + 强配方@1.0」在 k=3 生产口径给出 local Final
#       0.6905 -> 0.6966（+0.0061，三方向全非负）。本配置把该配方迁移到
#       当前 active 提交所用的全量 3534 身份口径（final_full_b75）。
# 口径：全量 labels.csv 已见全部身份，**无无泄漏本地验证**，属盲提交成员。
# 对照：outputs/full_convnext_t（同骨干 w_cm=0.3 的全量基线）
# 用法：python train.py --config config/train_convnext_t_strong_cm_full.yaml
# ============================================================

# ---------- 基础 ----------
seed: 42
device: cuda
project_name: ship_reid_convnext_t_strong_cm_full

# ---------- 数据（全量 labels.csv = 3534 身份/7422 图） ----------
data_root: ../../question6-data/traindata
train_labels_csv: ../../question6-data/traindata/labels.csv
val_labels_csv: ""
test_task_json: ../../question6-data/preliminary-round-test-data/task.json
local_val_task_json: ../../question6-data/traindata/local_val_task.json
local_val_gt_json: ../../question6-data/traindata/local_val_gt.json
auto_num_classes: true

# ---------- 数据加载 ----------
image_size: 224
# 与 2828 强配方配置一致：12 个 spawn worker 在 Windows 上会触发 CUDA 上下文
# 并发 OOM，降到 4 后 batch 160 正常。仅影响数据加载速度，不改变配方。
num_workers: 4
# 模态独立归一化（由 02_prepare_data.bat -> compute_stats.py 实测）
optical_mean: [0.1709, 0.2070, 0.2151]
optical_std: [0.1967, 0.1956, 0.1908]
sar_mean: [0.0242, 0.0242, 0.0242]
sar_std: [0.1214, 0.1214, 0.1214]
sar_speckle_aug: true

# ---------- PK 采样（实测 p=80,k=2 -> batch=160） ----------
pk_p: 80
pk_k: 2
pk_prefer_dual_modal: true
pk_sampler: cross_modal

# ---------- 模型（ConvNeXt-Tiny 双分支） ----------
backbone: convnext_tiny
pretrained: true
pretrained_path: ""
split_idx: 2              # 前 2 个 stage 为模态特定，其余共享
embedding_dim: 0
modality_projection: false

# ---------- 损失（唯一配方改动：跨模态权重 0.3 -> 1.0，方向对称） ----------
w_supcon: 0.5
w_triplet: 0.3
w_ce: 1.0
w_arcface: 0.3
arcface_scale: 30.0
arcface_margin: 0.5
supcon_temperature: 0.07
triplet_margin: 0.3
label_smooth: 0.1
w_cm_infonce: 1.0
w_cm_triplet: 1.0
cm_temperature: 0.07
cm_margin: 0.3

# ---------- 训练 ----------
# 与冠军同配方同轮数（batch 160 时每 epoch ~37 步）
epochs: 100
lr: 0.0006
backbone_lr_scale: 0.1
weight_decay: 0.0005
scheduler: cosine
warmup_epochs: 3
ema_decay: 0.999
amp: true
resume: ""

# ---------- 输出 ----------
output_dir: outputs/full_convnext_t_strong_cm
log_interval: 20
eval_interval: 1
tb_enabled: false
save_every: 20            # ep20/40/60/80/100 供逐点取用

# ---------- 推理 ----------
topk: 10
test_batch_size: 64