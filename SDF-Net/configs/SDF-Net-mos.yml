MODEL:
  PRETRAIN_CHOICE: 'clip'
  PRETRAIN_PATH: "./logs/SDF-Net/SDF-Net_256.pth"
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_base_patch16_224_TransOSS'
  STRIDE_SIZE: [16, 16]
  MIE: True
  MIE_COE: 3.0
  SSE: True
  PAIR: False
  DISENTANGLE: True
  ABLATION_MODE: "sum"
  ORTH_LOSS_WEIGHT: 10.0
  STRUCT_LOSS_WEIGHT: 1.0
  STRUCT_LAYER_INDEX: 6
  # MOS 的 class-wise 模态对齐损失（CMAL）—— 本配置相对 SDF-Net.yml 的唯一改动
  CMAL_LOSS_WEIGHT: 1.0

INPUT:
  SIZE_TRAIN: [256, 256]
  SIZE_TEST: [256, 256]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.2 # random erasing
  PADDING: 10
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]

DATASETS:
  NAMES: ('HOSS')
  ROOT_DIR: ('H:/Ship-Re-Identification/Multi-source-Satellite-Cross-modal-Ship-Re-Identification-main/SDF-Net/data')

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 2
  NUM_WORKERS: 4

SOLVER:
  OPTIMIZER_NAME: 'AdamW'
  MAX_EPOCHS: 80
  BASE_LR: 0.0001
  IMS_PER_BATCH: 32
  WARMUP_METHOD: 'linear'
  WARMUP_EPOCHS: 5
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 5
  LOG_PERIOD: 25
  EVAL_PERIOD: 5
  WEIGHT_DECAY:  1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2

TEST:
  EVAL: True
  IMS_PER_BATCH: 1
  RE_RANKING: False
  WEIGHT: "./logs/SDF-Net/SDF-Net_256.pth"
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: "H:/Ship-Re-Identification/Multi-source-Satellite-Cross-modal-Ship-Re-Identification-main/logs/SDF-Net-mos/"