# ============================================================
# GPU 正式训练配置示例
# 目标硬件：RTX 4070 Ti SUPER (16GB) / 32GB 内存 / CUDA 12.4
# 用法：
#   python train.py --config config/train_gpu.yaml
# 说明：Config.load 只加载本文件（不自动合并 default.yaml），因此真实数据
#   路径在下文显式列出，与 default.yaml 保持一致；已启用 AMP 混合精度、
#   EMA 权重、Warmup+Cosine 调度。
# ============================================================

# ---------- 基础 ----------
seed: 42
device: cuda                      # GPU 训练（不可用时自动回退 cpu）
project_name: ship_reid_gpu

# ---------- 数据（真实路径，与 default.yaml 保持一致） ----------
data_root: ../赛题6-初赛/训练数据
train_ann: ""                     # JSON 模式标注，当前用 CSV 模式，无需填写
val_ann: ""                       # JSON 模式验证标注，当前用 CSV 模式，无需填写
train_labels_csv: ../赛题6-初赛/训练数据/labels_train.csv
val_labels_csv: ""                # 验证 labels.csv（留空则训练时不验证）
test_task_json: ../赛题6-初赛/初赛测试数据/task.json

# ---------- 数据加载 ----------
num_workers: 8                   # 32GB 内存 + 16GB 显存，8 进程加载较均衡

# ---------- PK 采样 ----------
# 16GB 显存下 ResNet50 双分支 256x256 + AMP 可支撑 batch 48~64
pk_p: 24                         # 每 batch 24 个身份
pk_k: 2                          # 每身份 2 张 -> batch_size = 48
# pk_k=2 理由：赛题 90% 身份仅双模态各 1 张（O1+S1），pk_k=4 需补重复样本；
# pk_k=2 恰好构成跨模态正对（每身份 O1+S1 各 1 张），与跨模态损失天然匹配
pk_prefer_dual_modal: true

# ---------- 模型 ----------
backbone: resnet50
pretrained: true
share_layer: layer3

# ---------- 损失 ----------
w_supcon: 0.5
w_triplet: 0.3
w_ce: 1.0
label_smooth: 0.1

# ---------- 实验开关（第一阶段跨模态特征学习，默认全部关闭/不启用） ----------
w_cm_infonce: 0.0              # 跨模态 InfoNCE 权重（>0 时启用）
w_cm_triplet: 0.0              # 跨模态 hard triplet 权重（>0 时启用）
cm_temperature: 0.07           # 跨模态 InfoNCE 温度
cm_margin: 0.3                 # 跨模态 triplet margin
modality_projection: false     # 模态特定投影头（true 时使用 ModalityAwareHead）
pk_sampler: cross_modal        # 采样器: pk=旧版, cross_modal=模态均衡（如需严格复现旧采样改为 pk）

# ---------- 训练 ----------
epochs: 120                      # 正式训练
lr: 0.0003
backbone_lr_scale: 0.1           # 骨干学习率 = 3e-5
weight_decay: 0.0005
scheduler: cosine
warmup_epochs: 1
ema_decay: 0.999
resume: ""                       # 断点续训时填写 checkpoint 路径

# ---------- 输出 ----------
output_dir: outputs
log_interval: 20
eval_interval: 1
tb_enabled: true
